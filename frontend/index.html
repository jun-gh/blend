<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blend – Hybrid Search RAG</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('blend_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Popover polyfill: load only when native support is missing (Baseline newly available) -->
    <script type="module">
      if (!("popover" in HTMLElement.prototype)) {
        import("https://unpkg.com/@oddbird/popover-polyfill@latest/dist/popover.min.js");
      }
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
